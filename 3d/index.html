<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavanda Hills 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen 3D view with a floating tour panel on the left (bottom sheet on phones) */
:root{
  --bg:#FAF6F2; --panel:rgba(250,246,242,.94); --fg:#2B1F26; --muted:#6E5C63; --line:#E4D7D0; --accent:#6D3A63; --chip:#F1E8E2;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1519;--panel:rgba(29,21,25,.92);--fg:#F4ECEE;--muted:#B9A8AF;--line:#3B2D34;--accent:#C9A6DA;--chip:#2C2128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1519;--panel:rgba(29,21,25,.92);--fg:#F4ECEE;--muted:#B9A8AF;--line:#3B2D34;--accent:#C9A6DA;--chip:#2C2128;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
#panel header{padding:16px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
#panel h1{font-family:var(--display);font-size:18px;margin:0}
#panel header p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
#stops{overflow-y:auto;padding:8px 8px 12px;flex:1;min-height:0}
.grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;padding:12px 8px 4px}
.stop{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;padding:7px 8px;border-radius:6px;cursor:pointer}
.stop:hover{background:var(--chip)}
.stop[aria-current="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.stop:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls{border-top:1px solid var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#cap{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;max-width:46vw}
#hint{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--muted);max-width:300px}
#move{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px}
#move .btn{width:52px;height:44px;font-size:18px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px}
@media (max-width:760px){
  #panel{top:auto;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:42vh}
  #hint{display:none}
  #move{display:flex;bottom:calc(42vh + 20px)}
  #cap{max-width:70vw;left:calc(8px + env(safe-area-inset-left,0px));right:auto}
}
</style>

<canvas id="view" aria-label="3D-модель виллы Lavanda Hills"></canvas>
<div id="cap">Подход к вилле</div>
<aside id="panel">
  <header>
    <h1>Lavanda Hills</h1>
    <p>3D-обход по планировкам 1 и 2 этажа. Выберите точку маршрута или идите сами.</p>
  </header>
  <nav id="stops" aria-label="Маршрут обхода"></nav>
  <div id="controls">
    <button class="btn" id="prev" type="button">← Назад</button>
    <button class="btn" id="next" type="button">Дальше →</button>
    <button class="btn" id="eve" type="button" aria-pressed="false">Вечер</button>
    <button class="btn" id="part" type="button" aria-pressed="true">Перегородки</button>
    <button class="btn" id="cut" type="button" aria-pressed="false">Без 2 этажа</button>
  </div>
</aside>
<div id="move"><button class="btn" id="fw" type="button" aria-label="Вперёд">▲</button><button class="btn" id="bw" type="button" aria-label="Назад">▼</button></div>
<div id="hint">Тяните мышью, чтобы осмотреться. W A S D или стрелки — идти, Q и E — вниз и вверх.</div>
<div id="err">Не удалось запустить 3D. Откройте страницу в браузере с поддержкой WebGL.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const T=THREE;
const canvas=document.getElementById('view');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(62,1,0.05,1400);

/* ---------- textures ---------- */
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep[0],rep[1]);return t;}
function noise(g,w,h,a){const d=g.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*a;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}g.putImageData(d,0,0);}
const travTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#e7d8bf';g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.strokeStyle='rgba(170,140,100,'+(Math.random()*.18)+')';g.lineWidth=1+Math.random()*2;g.beginPath();const y=Math.random()*h;g.moveTo(0,y);g.bezierCurveTo(w*.3,y+Math.random()*20-10,w*.6,y+Math.random()*20-10,w,y+Math.random()*10-5);g.stroke();}noise(g,w,h,14);g.strokeStyle='rgba(120,95,70,.35)';g.lineWidth=2;g.strokeRect(1,1,w-2,h/2-2);g.strokeRect(1,h/2,w-2,h/2-2);});
const oakTex=canvasTex(512,512,(g,w,h)=>{const n=6;for(let i=0;i<n;i++){g.fillStyle=['#b98a5c','#b0814f','#c09163','#a97c4f'][i%4];g.fillRect(0,i*h/n,w,h/n);for(let k=0;k<30;k++){g.strokeStyle='rgba(90,60,30,'+(Math.random()*.15)+')';g.beginPath();const y=i*h/n+Math.random()*h/n;g.moveTo(0,y);g.lineTo(w,y+Math.random()*4-2);g.stroke();}g.fillStyle='rgba(60,40,20,.35)';g.fillRect(0,i*h/n,w,1.5);}noise(g,w,h,10);});
const deckTex=canvasTex(512,512,(g,w,h)=>{const n=8;for(let i=0;i<n;i++){g.fillStyle=['#9c7653','#a07a55','#94704d'][i%3];g.fillRect(i*w/n,0,w/n,h);g.fillStyle='rgba(40,25,15,.5)';g.fillRect(i*w/n,0,3,h);}noise(g,w,h,12);});
const cladTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#262424';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(i*w/8,0,2,h);g.fillStyle='rgba(255,255,255,.04)';g.fillRect(i*w/8+3,0,2,h);}noise(g,w,h,8);});
const woodWallTex=canvasTex(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=['#a8723f','#9d6a39','#b07a46'][i%3];g.fillRect(i*w/8,0,w/8,h);g.fillStyle='rgba(50,25,10,.4)';g.fillRect(i*w/8,0,2,h);}noise(g,w,h,10);});
const plasterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*.05)+')';g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,10+Math.random()*30,5+Math.random()*14,Math.random()*3,0,7);g.fill();}noise(g,w,h,10);},[1,1]);
const tileTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);const n=8;for(let x=0;x<n;x++)for(let y=0;y<n;y++){const v=215+Math.random()*40;g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x*w/n+1,y*h/n+1,w/n-2,h/n-2);}},[2,2]);
function artTex(cols){return canvasTex(512,320,(g,w,h)=>{g.fillStyle=cols[0];g.fillRect(0,0,w,h);for(let i=1;i<cols.length;i++){g.fillStyle=cols[i];g.beginPath();const x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);for(let k=0;k<6;k++)g.quadraticCurveTo(Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h);g.fill();}});}

/* ---------- materials ---------- */
const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
const P=(c)=>M(c,{map:plasterTex,roughness:.95});
const mat={
  clad:M('#ffffff',{map:cladTex,roughness:.8}),
  woodWall:M('#ffffff',{map:woodWallTex,roughness:.7}),
  soffit:M('#c08a55',{map:woodWallTex,roughness:.7}),
  ochre:P('#d9a556'), sand:P('#e6d3b5'), sage:P('#a7b08c'), lav:P('#b9a3d6'), clay:P('#b8613f'), cobalt:P('#2b4696'), wine:P('#7d2a35'), ceil:P('#efe3cf'),
  tileOchre:M('#d4a02c',{map:tileTex,roughness:.25}), tilePlum:M('#6b3d6e',{map:tileTex,roughness:.25}), tileSage:M('#8fa289',{map:tileTex,roughness:.35}), tileCobalt:M('#2340a0',{map:tileTex,roughness:.2}),
  trav:M('#ffffff',{map:travTex,roughness:.7}),
  oak:M('#ffffff',{map:oakTex,roughness:.6}),
  deck:M('#ffffff',{map:deckTex,roughness:.8}),
  walnut:M('#5a3a24',{roughness:.5}), black:M('#1c1b1b',{roughness:.5,metalness:.4}), brass:M('#b8914a',{roughness:.35,metalness:.85}),
  plum:M('#5e2a4a',{roughness:.95}), wineF:M('#7a1f2e',{roughness:.95}), sageF:M('#8d9a73',{roughness:.95}), terra:M('#b4552f',{roughness:.95}), ochreF:M('#c99a2e',{roughness:.95}), cobaltF:M('#2a4594',{roughness:.95}), lavF:M('#b7a2d8',{roughness:.95}),
  linen:M('#efe6d6',{roughness:1}), white:M('#f4f1ea',{roughness:.2}), stone:M('#cbbca3',{roughness:.9}), tv:M('#111111',{roughness:.3}),
  glass:new T.MeshPhysicalMaterial({color:'#cfe3ea',transparent:true,opacity:.18,roughness:.05,metalness:0,depthWrite:false}),
  water:M('#4fa3b8',{roughness:.1,emissive:'#123a44',emissiveIntensity:.4}),
  mirror:M('#d8dde0',{roughness:.05,metalness:.9}),
  lampOn:M('#fff1d6',{emissive:'#ffcf8a',emissiveIntensity:1.2}),
  olive:M('#7d8a5c',{roughness:1}), trunk:M('#6b5844',{roughness:1}), cypress:M('#3f5136',{roughness:1}),
  grass:M('#9a9a5f',{roughness:1}), lavender:M('#8f73c2',{roughness:1}), mountain:M('#7f8ca1',{roughness:1}), rug1:M('#7a2f3a',{roughness:1}), rug2:M('#8a6a4a',{roughness:1}), rugBlue:M('#2f3f73',{roughness:1})
};

Object.values(mat).forEach(m=>{if(m.color)m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();});
const lin=c=>new T.Color(c).convertSRGBToLinear();
/* ---------- helpers ---------- */
const root=new T.Group();scene.add(root);
const floor2=new T.Group();root.add(floor2); // everything above ground-floor ceiling
let cur=root;
function B(x0,x1,y0,y1,z0,z1,m,parent){const g=new T.BoxGeometry(Math.max(x1-x0,.001),Math.max(y1-y0,.001),Math.max(z1-z0,.001));const me=new T.Mesh(g,m);me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);(parent||cur).add(me);return me;}
function C(x,z,y0,h,r,m,seg,r2){const me=new T.Mesh(new T.CylinderGeometry(r2===undefined?r:r2,r,h,seg||24),m);me.position.set(x,y0+h/2,z);cur.add(me);return me;}
function S(x,y,z,r,m,sx,sy,sz){const me=new T.Mesh(new T.SphereGeometry(r,20,14),m);me.position.set(x,y,z);me.scale.set(sx||1,sy||1,sz||1);cur.add(me);return me;}
function plane(x0,x1,z0,z1,y,m,tile,down){const t=m.map?m.clone():m;if(m.map){t.map=m.map.clone();t.map.needsUpdate=true;t.map.repeat.set((x1-x0)/tile,(z1-z0)/tile);}const me=new T.Mesh(new T.PlaneGeometry(x1-x0,z1-z0),t);me.rotation.x=down?Math.PI/2:-Math.PI/2;me.position.set((x0+x1)/2,y,(z0+z1)/2);cur.add(me);return me;}
// wall along X at z=zc; side A faces -z, side B faces +z. holes: [a,b,lo,hi,glass]
function wallX(zc,x0,x1,y0,y1,holes,mA,mB,t){t=t||.14;layer(zc-t/2,zc,mA);layer(zc,zc+t/2,mB);
  function layer(za,zb,m){let c=x0;(holes||[]).slice().sort((p,q)=>p[0]-q[0]).forEach(h=>{if(h[0]>c)B(c,h[0],y0,y1,za,zb,m);if(h[2]>0)B(h[0],h[1],y0,y0+h[2],za,zb,m);if(y0+h[3]<y1)B(h[0],h[1],y0+h[3],y1,za,zb,m);c=h[1];});if(c<x1)B(c,x1,y0,y1,za,zb,m);}
  (holes||[]).forEach(h=>{if(h[4]){const g=B(h[0],h[1],y0+h[2],y0+h[3],zc-.01,zc+.01,mat.glass);g.castShadow=false;}});}
function wallZ(xc,z0,z1,y0,y1,holes,mA,mB,t){t=t||.14;layer(xc-t/2,xc,mA);layer(xc,xc+t/2,mB);
  function layer(xa,xb,m){let c=z0;(holes||[]).slice().sort((p,q)=>p[0]-q[0]).forEach(h=>{if(h[0]>c)B(xa,xb,y0,y1,c,h[0],m);if(h[2]>0)B(xa,xb,y0,y0+h[2],h[0],h[1],m);if(y0+h[3]<y1)B(xa,xb,y0+h[3],y1,h[0],h[1],m);c=h[1];});if(c<z1)B(xa,xb,y0,y1,c,z1,m);}
  (holes||[]).forEach(h=>{if(h[4]){const g=B(xc-.01,xc+.01,y0+h[2],y0+h[3],h[0],h[1],mat.glass);g.castShadow=false;}});}
const lights=[];
function lamp(x,y,z,power,dist){const l=new T.PointLight('#ffb978',0,dist||6,2);l.position.set(x,y,z);cur.add(l);lights.push({l,p:power||1.2});return l;}
function rug(x0,x1,z0,z1,y,m){B(x0,x1,y+.003,y+.013,z0,z1,m);}
function art(x0,x1,y0,y1,z0,z1,cols){const m=new T.MeshStandardMaterial({map:artTex(cols),roughness:.8});B(x0,x1,y0,y1,z0,z1,m);}

/* =================== GROUND FLOOR (y 0..3.0) =================== */
const H1=3.0;
// slab + verandas on stilts
B(-2,9,-.35,0,0,13,mat.black);
plane(0,9,0,8,.002,mat.trav,1.2);
plane(-2,0,0,8,.002,mat.deck,1.6);
plane(-2,9,8,13,.002,mat.deck,1.6);
[[-1.9,.2],[-1.9,4],[-1.9,8],[-1.9,12.8],[1.5,12.8],[4.5,12.8],[7.5,12.8],[8.8,12.8],[1.5,8],[4.5,8],[8.8,8],[8.8,4],[8.8,.2],[4.5,.2],[1.5,.2],[4.5,4]].forEach(p=>C(p[0],p[1],-2.2,1.85,.16,mat.stone,14));
// railing around veranda edge (no stairs anywhere)
function railX(z,x0,x1){B(x0,x1,1.0,1.05,z-.03,z+.03,mat.black);for(let x=x0;x<=x1+.01;x+=.12)B(x-.008,x+.008,0,1.0,z-.008,z+.008,mat.black);}
function railZ(x,z0,z1){B(x-.03,x+.03,1.0,1.05,z0,z1,mat.black);for(let z=z0;z<=z1+.01;z+=.12)B(x-.008,x+.008,0,1.0,z-.008,z+.008,mat.black);}
railX(13,-2,9);railZ(-2,0,13);railZ(9,8,13);railX(0,-2,0);
// exterior walls (outer cladding, inner per room)
wallX(0,0,2.5,0,H1,[],mat.clad,mat.sage,.25);
wallX(0,2.5,5.5,0,H1,[[3.6,4.4,1.6,2.2,true]],mat.clad,mat.tileOchre,.25);
wallX(0,5.5,9,0,H1,[[6.6,7.4,0,2.2]],mat.clad,mat.sand,.25);
wallZ(0,0,2.8,0,H1,[[1.5,2.4,0,2.3]],mat.clad,mat.sage,.25);
wallZ(0,2.8,8,0,H1,[[5.9,7.95,0,H1-.05,true]],mat.clad,mat.ochre,.25);
wallZ(9,0,2.6,0,H1,[],mat.sand,mat.clad,.25);
wallZ(9,2.6,8,0,H1,[[7.4,7.95,0,H1-.05,true]],mat.ochre,mat.clad,.25);
// front: full 9 m glazing with slim mullions, open sliding door 6.0..7.2
for(let x=0;x<=9.01;x+=1.5)B(x-.04,x+.04,0,H1,7.96,8.04,mat.black);
B(0,9,H1-.12,H1,7.94,8.06,mat.black);
[[0,6.0],[7.2,9]].forEach(r=>{const g=B(r[0],r[1],0,H1-.12,7.99,8.01,mat.glass);g.castShadow=false;});
// interior walls
wallZ(2.5,0,2.0,0,H1,[],mat.sage,mat.tileOchre);
wallZ(2.5,2.0,2.8,0,H1,[],mat.sage,mat.ochre);
wallX(2.8,0,2.5,0,H1,[[1.5,2.35,0,2.2]],mat.sage,mat.ochre);
wallX(2.0,2.5,5.5,0,H1,[[3.4,4.2,0,2.2]],mat.tileOchre,mat.ochre);
wallZ(5.5,0,2.0,0,H1,[],mat.tileOchre,mat.sand);
wallZ(5.5,2.0,2.6,0,H1,[],mat.ochre,mat.sand);
wallX(2.6,5.5,9,0,H1,[[5.65,6.4,0,2.2]],mat.sand,mat.ochre);
wallZ(6.2,3.0,4.2,0,H1,[],mat.ochre,mat.ochre);
// ceiling + beams
plane(0,9,0,8,H1-.001,mat.ceil,3,true);
for(let z=3.4;z<7.9;z+=1.1)B(0,6.2,H1-.22,H1,z-.09,z+.09,mat.walnut);
// staircase: flight A up along -z at x 8..9, landing, flight B along -x at z 3..4 to top at x 6.3
const R=3.3/16;
for(let i=0;i<7;i++){const z1=5.8-i*.257;B(8.0,8.95,0,R*(i+1),z1-.257,z1,mat.oak);}
B(8.0,8.95,0,R*8,3.0,4.0,mat.oak);
for(let i=0;i<8;i++){const x1=8.0-i*.2125;B(x1-.2125,x1,R*(9+i)-.06,R*(9+i),3.02,4.0,mat.oak);}
B(6.3,8.0,0,0,3,3,mat.oak);
B(7.95,8.0,0,R*8+1,4.0,5.8,mat.walnut); // stringer/handrail side
B(6.3,8.0,R*16+.9,R*16+.95,4.0,4.04,mat.walnut);
// tambour: wardrobe, bench, mirror

const nav=document.getElementById('stops');let lastG='';
tour.forEach((t,i)=>{if(t[0]!==lastG){const g=document.createElement('div');g.className='grp';g.textContent=t[0];nav.appendChild(g);lastG=t[0];}
  const b=document.createElement('button');b.className='stop';b.type='button';b.textContent=t[1];b.id='stop'+i;b.onclick=()=>go(i);nav.appendChild(b);});

let yaw=0,pitch=0;const pos=new T.Vector3();
function dirFrom(y,p){return new T.Vector3(Math.sin(y)*Math.cos(p),Math.sin(p),Math.cos(y)*Math.cos(p));}
function anglesTo(from,to){const d=new T.Vector3().subVectors(to,from).normalize();return [Math.atan2(d.x,d.z),Math.asin(Math.max(-1,Math.min(1,d.y)))];}
let anim=null,idx=0;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i){idx=(i+tour.length)%tour.length;const t=tour[idx];
  document.querySelectorAll('.stop').forEach(b=>b.setAttribute('aria-current','false'));const b=document.getElementById('stop'+idx);b.setAttribute('aria-current','true');b.scrollIntoView({block:'nearest'});
  document.getElementById('cap').textContent=(t[0].startsWith('Номер')||t[0].startsWith('Веранда')?t[0]+': ':'')+t[1];
  const to=new T.Vector3(...t[2]);const [ty,tp]=anglesTo(to,new T.Vector3(...t[3]));
  // hide 2nd floor when looking from above
  if(t[1]==='Вид сверху'){setCut(true);}else if(cutAuto){setCut(false);}
  if(t[1]==='Вся веранда'||t[1]==='Вид с веранды'){part.visible=false;document.getElementById('part').setAttribute('aria-pressed','false');}
  if(reduce){pos.copy(to);yaw=ty;pitch=tp;return;}
  let dy=ty-yaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;
  anim={t:0,from:pos.clone(),to,y0:yaw,y1:yaw+dy,p0:pitch,p1:tp};}
let cutAuto=false;
function setCut(v,manual){floor2.visible=!v;cutAuto=!manual&&v;document.getElementById('cut').setAttribute('aria-pressed',v);}

document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('eve').onclick=()=>setMood(!evening);
document.getElementById('part').onclick=e=>{part.visible=!part.visible;e.currentTarget.setAttribute('aria-pressed',part.visible);};
document.getElementById('cut').onclick=()=>setCut(floor2.visible,true);

/* ---------- free look & walk ---------- */
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);anim=null;});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};yaw-=dx*.0045;pitch=Math.max(-1.45,Math.min(1.45,pitch+dy*.0045));});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
const keys={};
window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let hold=0;const fw=document.getElementById('fw'),bw=document.getElementById('bw');
[[fw,1],[bw,-1]].forEach(([el,v])=>{el.addEventListener('pointerdown',e=>{e.preventDefault();hold=v;anim=null;});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>hold=0));});

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

const clock=new T.Clock();
function frame(){const dt=Math.min(clock.getDelta(),.05);
  if(anim){anim.t=Math.min(1,anim.t+dt/1.3);const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;pos.lerpVectors(anim.from,anim.to,k);yaw=anim.y0+(anim.y1-anim.y0)*k;pitch=anim.p0+(anim.p1-anim.p0)*k;if(anim.t>=1)anim=null;}
  const f=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)+hold;
  const s=(keys['d']?1:0)-(keys['a']?1:0);const turn=(keys['arrowleft']?1:0)-(keys['arrowright']?1:0);
  yaw+=turn*dt*1.6;
  if(f||s||keys['q']||keys['e']){anim=null;const fwv=new T.Vector3(Math.sin(yaw),0,Math.cos(yaw));const rt=new T.Vector3(-Math.cos(yaw),0,Math.sin(yaw));pos.addScaledVector(fwv,f*dt*2.4).addScaledVector(rt,s*dt*2.4);pos.y+=((keys['e']?1:0)-(keys['q']?1:0))*dt*2;}
  camera.position.copy(pos);camera.lookAt(pos.clone().add(dirFrom(yaw,pitch)));
  renderer.render(scene,camera);requestAnimationFrame(frame);}
let start=0;try{const h=(location.hash||'').replace('#stop','');if(h!==''&&!isNaN(+h))start=+h;}catch(e){}
pos.set(...tour[start][2]);[yaw,pitch]=anglesTo(pos,new T.Vector3(...tour[start][3]));go(start);anim=null;
frame();
})();
